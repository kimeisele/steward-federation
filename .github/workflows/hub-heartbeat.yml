name: Federation Hub Heartbeat

on:
  schedule:
    - cron: '5-59/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hub-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout steward-federation
        uses: actions/checkout@v4
        with:
          # S1/repo-hygiene: the heartbeat only needs the current tree; full
          # history is ~0.5-0.7 GB per checkout, 96x/day. No workflow step or
          # nadi_kit.py accesses git history (verified 2026-08-16: only add,
          # commit, diff --cached, pull --rebase, push; the race rebase works
          # from a shallow clone because git fetches the needed depth).
          fetch-depth: 1

      - name: Repo-size guard
        # Phase-2 replacement (owner decision 2026-08-16): no periodic squash
        # (would destroy reproducibility). Instead alert when the server-side
        # repo size exceeds 1.5 GB; docs/steward-federation-shrink-runbook.md
        # then applies (manual Phase 1, owner-gated).
        env:
          GH_TOKEN: ${{ secrets.FEDERATION_PAT || secrets.GITHUB_TOKEN }}
        run: |
          SIZE_KB="$(gh api repos/kimeisele/steward-federation --jq .size)"
          LIMIT_KB=$(( 1500 * 1024 ))
          echo "steward-federation repo size: ${SIZE_KB} KB (limit ${LIMIT_KB} KB)"
          if [ "$SIZE_KB" -gt "$LIMIT_KB" ]; then
            echo "::error ::steward-federation repo size ${SIZE_KB} KB exceeds 1.5 GB; run the shrink runbook (Phase 1, owner-gated)"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install checked-out nadi-kit
        run: |
          python -m pip install .

      - name: Run NADI heartbeat cycle
        env:
          GH_TOKEN: ${{ secrets.FEDERATION_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.FEDERATION_PAT || secrets.GITHUB_TOKEN }}
          NODE_PRIVATE_KEY: ${{ secrets.NODE_PRIVATE_KEY }}
        run: |
          python3 nadi_kit.py sync
          python3 nadi_kit.py heartbeat
          python3 nadi_kit.py sync
          echo "Heartbeat + sync complete"

      - name: Commit heartbeat to hub
        run: |
          git config user.name "steward-federation-bot"
          git config user.email "bot@steward-federation"
          git add nadi/steward-federation_to_steward.json
          git diff --cached --quiet || \
            git commit -m "relay: steward-federation hub heartbeat #${{ github.run_number }}"
          max_retries=10
          count=0
          until git push origin main; do
            count=$((count+1))
            if [ $count -gt $max_retries ]; then
              echo "Push failed after $max_retries attempts"
              exit 1
            fi
            backoff=$(( (RANDOM % 15) + 2 ))
            echo "Race condition. Backoff ${backoff}s then rebase..."
            sleep $backoff
            # --autostash: nadi_kit.py sync leaves uncommitted local files
            # (e.g. nadi_inbox.json). Without it the rebase refuses with
            # "cannot pull with rebase: You have unstaged changes" and the
            # heartbeat dies on the first push conflict. The stash is
            # re-applied automatically after the rebase.
            git pull --rebase --autostash origin main
          done
