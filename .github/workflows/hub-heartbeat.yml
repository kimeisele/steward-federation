name: Federation Hub Heartbeat

on:
  schedule:
    - cron: '5-59/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hub-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout steward-federation
        uses: actions/checkout@v4
        with:
          # S1/repo-hygiene: the heartbeat only needs the current tree; full
          # history is ~0.5-0.7 GB per checkout, 96x/day. No workflow step or
          # nadi_kit.py accesses git history (verified 2026-08-16: only add,
          # commit, diff --cached, pull --rebase, push; the race rebase works
          # from a shallow clone because git fetches the needed depth).
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install checked-out nadi-kit
        run: |
          python -m pip install .

      - name: Run NADI heartbeat cycle
        env:
          GH_TOKEN: ${{ secrets.FEDERATION_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.FEDERATION_PAT || secrets.GITHUB_TOKEN }}
          NODE_PRIVATE_KEY: ${{ secrets.NODE_PRIVATE_KEY }}
        run: |
          python3 nadi_kit.py sync
          python3 nadi_kit.py heartbeat
          python3 nadi_kit.py sync
          echo "Heartbeat + sync complete"

      - name: Commit heartbeat to hub
        run: |
          git config user.name "steward-federation-bot"
          git config user.email "bot@steward-federation"
          git add nadi/steward-federation_to_steward.json
          git diff --cached --quiet || \
            git commit -m "relay: steward-federation hub heartbeat #${{ github.run_number }}"
          max_retries=10
          count=0
          until git push origin main; do
            count=$((count+1))
            if [ $count -gt $max_retries ]; then
              echo "Push failed after $max_retries attempts"
              exit 1
            fi
            backoff=$(( (RANDOM % 15) + 2 ))
            echo "Race condition. Backoff ${backoff}s then rebase..."
            sleep $backoff
            git pull --rebase origin main
          done
